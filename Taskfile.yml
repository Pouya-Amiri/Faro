version: "3"

vars:
  APP_NAME: Faro
  BIN_DIR: build/bin
  GOOS: '{{.GOOS | default OS}}'
  ARCH: '{{.ARCH | default ARCH}}'
  # This command reads internal/buildinfo/version.go, the only hand-edited
  # version source. Release metadata is regenerated by sync:version.
  VERSION:
    sh: go run ./cmd/faro-version
  BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false{{end}}'

tasks:
  build:
    desc: Build Faro for the selected platform
    cmds:
      - task: 'build:{{.GOOS}}'

  package:
    desc: Build platform-native distributable packages
    cmds:
      - task: 'package:{{.GOOS}}'

  run:
    desc: Run the desktop application
    cmds:
      - task: 'run:{{.GOOS}}'

  dev:
    desc: Rebuild and restart Faro as source files change
    cmds:
      - wails3 dev -config ./build/config.yml

  tidy:
    desc: Normalize Go module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove generated build and release output
    cmds:
      - rm -rf build/bin build/ios build/linux build/package build/windows/nsis dist dist_actions
      - rm -f build/darwin/Info.dev.plist
      - rm -f wails_windows_*.syso wails_linux_*.syso wails_darwin_*.syso Faro Faro.exe faro faro-server faro-server.exe

  prepare-output:
    internal: true
    run: once
    cmds:
      - mkdir -p {{.BIN_DIR}}

  build:server:
    desc: Build the standalone Faro server
    deps: [prepare-output]
    cmds:
      - go build {{.BUILD_FLAGS}} -ldflags='{{if eq .DEV "true"}}-X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{else}}-w -s -X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{end}}' -o {{.SERVER_OUTPUT}} ./cmd/faro-server
    vars:
      SERVER_OUTPUT: '{{.BIN_DIR}}/faro-server{{if eq .GOOS "windows"}}.exe{{end}}'
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: "0"

  build:linux:
    desc: Build the Linux desktop application with GTK4 and WebKitGTK 6
    deps: [prepare-output]
    cmds:
      - go build {{.BUILD_FLAGS}} -ldflags='{{if eq .DEV "true"}}-X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{else}}-w -s -X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{end}}' -o {{.BIN_DIR}}/faro .
    env:
      GOOS: linux
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: "1"

  build:windows:
    desc: Build the Windows desktop application
    deps: [prepare-output]
    cmds:
      - task: generate:windows-resources
      - defer: rm -f wails_windows_{{.ARCH}}.syso
      - go build {{.BUILD_FLAGS}} -ldflags='{{if eq .DEV "true"}}-X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{else}}-w -s -H windowsgui -X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{end}}' -o {{.BIN_DIR}}/Faro.exe .
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: "0"

  generate:windows-resources:
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso

  build:darwin:
    desc: Build the macOS desktop application
    deps: [prepare-output]
    cmds:
      - go build {{.BUILD_FLAGS}} -ldflags='{{if eq .DEV "true"}}-X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{else}}-w -s -X github.com/Pouya-Amiri/Faro/internal/buildinfo.Version={{.VERSION}}{{end}}' -o {{.BIN_DIR}}/Faro .
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: "1"
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  sync:version:
    desc: Synchronize generated package metadata with the source version
    run: once
    cmds:
      - go run ./cmd/faro-release sync

  update:build-assets:
    desc: Regenerate Wails v3 platform metadata from the source version
    deps: [sync:version]
    cmds:
      - >-
        wails3 update build-assets
        -name Faro
        -binaryname Faro
        -productname Faro
        -productversion {{.VERSION}}
        -productidentifier io.github.pouya-amiri.Faro
        -productcompany "Faro contributors"
        -productcopyright "Copyright Faro contributors"
        -productdescription "Secure synchronized media playback"
        -productcomments "Secure synchronized media playback"
        -config config.yml
        -dir .
    dir: build

  package:linux:
    desc: Build Linux desktop packages and a standalone server archive
    cmds:
      - task: update:build-assets
      - task: build:linux
      - mkdir -p dist_actions
      - wails3 tool package -name faro -format deb -config packaging/linux/nfpm.yaml -out dist_actions
      - wails3 tool package -name faro -format rpm -config packaging/linux/nfpm.yaml -out dist_actions
      # WebKitGTK helper paths are distribution-specific and compiled into the
      # library. Build a thin AppImage that uses the host GTK/WebKit stack just
      # like the native packages instead of bundling an Ubuntu-specific copy.
      - packaging/linux/build_appimage.sh {{.VERSION}} {{.APPIMAGE_ARCH}}
      - mv -f dist_actions/faro.deb 'dist_actions/Faro-{{.VERSION}}-linux-{{.ARCH}}.deb'
      - mv -f dist_actions/faro.rpm 'dist_actions/Faro-{{.VERSION}}-linux-{{.RPM_ARCH}}.rpm'
      - task: package:server
        vars: {GOOS: linux, ARCH: '{{.ARCH}}', DIST_ARCH: '{{.APPIMAGE_ARCH}}'}
    vars:
      RPM_ARCH: '{{if eq .ARCH "amd64"}}x86_64{{else if eq .ARCH "arm64"}}aarch64{{else}}{{.ARCH}}{{end}}'
      APPIMAGE_ARCH: '{{if eq .ARCH "amd64"}}x86_64{{else if eq .ARCH "arm64"}}aarch64{{else}}{{.ARCH}}{{end}}'
    env:
      VERSION: '{{.VERSION}}'
      ARCH: '{{.ARCH}}'

  package:windows:
    desc: Build the Windows desktop installer and standalone server archive
    cmds:
      - task: update:build-assets
      - task: build:windows
      - task: build:server
        vars: {GOOS: windows, ARCH: '{{.ARCH}}'}
      - iscc /DAppVersion={{.VERSION}} packaging/windows/installer.iss
      - powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/package.ps1 -Version {{.VERSION}}

  package:darwin:
    desc: Build the macOS app DMG and standalone server archive
    cmds:
      - task: update:build-assets
      - task: build:darwin
      - rm -rf {{.BIN_DIR}}/Faro.app
      - mkdir -p {{.BIN_DIR}}/Faro.app/Contents/MacOS
      - mkdir -p {{.BIN_DIR}}/Faro.app/Contents/Resources
      - cp {{.BIN_DIR}}/Faro {{.BIN_DIR}}/Faro.app/Contents/MacOS/Faro
      - cp packaging/assets/Faro.icns {{.BIN_DIR}}/Faro.app/Contents/Resources/icons.icns
      - cp build/darwin/Info.plist {{.BIN_DIR}}/Faro.app/Contents/Info.plist
      - cp LICENSE THIRD_PARTY_NOTICES.txt {{.BIN_DIR}}/Faro.app/Contents/Resources/
      - packaging/macos/build_dmg.sh {{.VERSION}} {{.DIST_ARCH}}
      - task: package:server
        vars: {GOOS: darwin, ARCH: '{{.ARCH}}', DIST_ARCH: '{{.DIST_ARCH}}'}
    vars:
      DIST_ARCH: '{{if eq .ARCH "amd64"}}x86_64{{else}}{{.ARCH}}{{end}}'

  package:server:
    internal: true
    cmds:
      - task: build:server
        vars: {GOOS: '{{.GOOS}}', ARCH: '{{.ARCH}}'}
      - '{{if eq .GOOS "darwin"}}codesign --force --sign - {{.BIN_DIR}}/faro-server{{else}}true{{end}}'
      - '{{if eq .GOOS "darwin"}}codesign --verify --strict {{.BIN_DIR}}/faro-server{{else}}true{{end}}'
      - rm -rf build/package/server
      - mkdir -p build/package/server
      - cp '{{.BIN_DIR}}/faro-server{{if eq .GOOS "windows"}}.exe{{end}}' build/package/server/
      - cp LICENSE THIRD_PARTY_NOTICES.txt build/package/server/
      - tar -czf 'dist_actions/faro-server-{{.VERSION}}-{{.GOOS}}-{{.DIST_ARCH}}.tar.gz' -C build/package/server .
    requires:
      vars: [GOOS, ARCH, DIST_ARCH]

  run:linux:
    cmds: [build/bin/faro]

  run:windows:
    cmds: [build/bin/Faro.exe]

  run:darwin:
    desc: Launch the macOS development bundle (run `wails3 build` first)
    preconditions:
      - sh: test -f {{.BIN_DIR}}/Faro
        msg: "{{.BIN_DIR}}/Faro is missing. Run `wails3 build` before `wails3 task run:darwin`."
    cmds:
      # macOS needs a bundle for the dock, menus and Info.plist. `wails3 dev`
      # rebuilds the binary before this task runs.
      - rm -rf {{.BIN_DIR}}/Faro.dev.app
      - mkdir -p {{.BIN_DIR}}/Faro.dev.app/Contents/MacOS
      - mkdir -p {{.BIN_DIR}}/Faro.dev.app/Contents/Resources
      - cp {{.BIN_DIR}}/Faro {{.BIN_DIR}}/Faro.dev.app/Contents/MacOS/Faro
      - cp packaging/assets/Faro.icns {{.BIN_DIR}}/Faro.dev.app/Contents/Resources/icons.icns
      - cp build/darwin/Info.plist {{.BIN_DIR}}/Faro.dev.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/Faro.dev.app
      - '{{.BIN_DIR}}/Faro.dev.app/Contents/MacOS/Faro'
